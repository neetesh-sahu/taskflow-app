name: TaskFlow CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==========================================
      # NODE.JS
      # ==========================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm


      # ==========================================
      # FRONTEND
      # ==========================================

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build


      # ==========================================
      # MICROSERVICES DEPENDENCIES
      # ==========================================

      - name: Install Gateway Dependencies
        run: npm ci
        working-directory: gateway

      - name: Install Auth Service Dependencies
        run: npm ci
        working-directory: services/auth-service

      - name: Install Task Service Dependencies
        run: npm ci
        working-directory: services/task-service

      - name: Install User Service Dependencies
        run: npm ci
        working-directory: services/user-service

      - name: Install Team Service Dependencies
        run: npm ci
        working-directory: team-service


      # ==========================================
      # DOCKER BUILDX
      # ==========================================

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ==========================================
      # DOCKER HUB LOGIN
      # ==========================================

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # ==========================================
      # FRONTEND IMAGE
      # ==========================================

      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-frontend:${{ github.sha }}


      # ==========================================
      # GATEWAY IMAGE
      # ==========================================

      - name: Build and Push Gateway
        uses: docker/build-push-action@v6
        with:
          context: ./gateway
          file: ./gateway/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-gateway:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-gateway:${{ github.sha }}


      # ==========================================
      # AUTH IMAGE
      # ==========================================

      - name: Build and Push Auth Service
        uses: docker/build-push-action@v6
        with:
          context: ./services/auth-service
          file: ./services/auth-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-auth:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-auth:${{ github.sha }}


      # ==========================================
      # TASK IMAGE
      # ==========================================

      - name: Build and Push Task Service
        uses: docker/build-push-action@v6
        with:
          context: ./services/task-service
          file: ./services/task-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-task:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-task:${{ github.sha }}


      # ==========================================
      # USER IMAGE
      # ==========================================

      - name: Build and Push User Service
        uses: docker/build-push-action@v6
        with:
          context: ./services/user-service
          file: ./services/user-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-user:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-user:${{ github.sha }}


      # ==========================================
      # TEAM IMAGE
      # ==========================================

      - name: Build and Push Team Service
        uses: docker/build-push-action@v6
        with:
          context: ./team-service
          file: ./team-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-team:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-team:${{ github.sha }}
