name: TaskFlow CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 608942061496.dkr.ecr.us-east-1.amazonaws.com

jobs:
  build-and-push:
    name: Build and Push TaskFlow Images
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install Auth Service dependencies
        working-directory: services/auth-service
        run: npm ci

      - name: Install Task Service dependencies
        working-directory: services/task-service
        run: npm ci

      - name: Install User Service dependencies
        working-directory: services/user-service
        run: npm ci

      - name: Install Team Service dependencies
        working-directory: team-service
        run: npm ci

      - name: Install Gateway dependencies
        working-directory: gateway
        run: npm ci

      - name: Configure AWS Credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::608942061496:role/TaskFlowGitHubActionsRole
          aws-region: us-east-1

      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Frontend
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/taskflow-frontend:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/taskflow-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-frontend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-frontend:latest

      - name: Build and Push Gateway
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./gateway
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/taskflow-gateway:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/taskflow-gateway:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-gateway:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-gateway:latest

      - name: Build and Push Auth Service
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./services/auth-service
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/taskflow-auth:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/taskflow-auth:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-auth:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-auth:latest

      - name: Build and Push Task Service
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./services/task-service
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/taskflow-task:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/taskflow-task:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-task:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-task:latest

      - name: Build and Push User Service
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./services/user-service
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/taskflow-user:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/taskflow-user:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-user:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-user:latest

      - name: Build and Push Team Service
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./team-service
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/taskflow-team:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/taskflow-team:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-team:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-team:latest

  deploy:
    name: Deploy TaskFlow to EC2
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::608942061496:role/TaskFlowGitHubActionsRole
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Prepare deployment directory
        run: |
          mkdir -p "$HOME/taskflow-deploy"
          cp docker-compose.prod.yml "$HOME/taskflow-deploy/docker-compose.yml"

      - name: Create production environment
        run: |
          cat > "$HOME/taskflow-deploy/.env" <<EOF
          POSTGRES_DB=taskflow
          POSTGRES_USER=taskflow
          POSTGRES_PASSWORD=${{ secrets.TASKFLOW_DB_PASSWORD }}
          JWT_SECRET=${{ secrets.TASKFLOW_JWT_SECRET }}
          AWS_REGION=us-east-1
          ECR_REGISTRY=608942061496.dkr.ecr.us-east-1.amazonaws.com
          IMAGE_TAG=latest
          EOF

      - name: Deploy containers
        run: |
          cd "$HOME/taskflow-deploy"
          docker compose pull
          docker compose up -d --remove-orphans

      - name: Verify deployment
        run: |
          cd "$HOME/taskflow-deploy"
          docker compose ps
          curl -f http://localhost/ || exit 1
          echo "TaskFlow deployment successful"